[package]
name = "rustdv-veryl-macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macros of rustdv-veryl: clocking blocks and modports."
license = "MIT"
repository = "https://github.com/taichi-ishitani/rustdv-veryl"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
